apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  namespace: atlas
spec:
  replicas: 2
  selector:
    matchLabels: {app: atlas-api}
  template:
    metadata: {labels: {app: atlas-api}}
    spec:
      containers:
        - name: api
          image: atlas-api:dev
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: atlas-secrets}}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: atlas-api, namespace: atlas}
spec:
  selector: {app: atlas-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: atlas-poll, namespace: atlas}
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: poll
              image: atlas-api:dev
              command: ["python", "scripts/backfill.py"]
              args: ["--topic", "reranking", "--min-citations", "80", "--limit", "50"]
              envFrom: [{secretRef: {name: atlas-secrets}}]
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: "2", memory: 1Gi}
---
# Secret template: atlas-secrets is referenced via envFrom above but NOT
# committed. Create it from your local .env (which holds real keys):
#   kubectl create secret generic atlas-secrets --from-env-file=.env -n atlas
# Template (kept commented so `kubectl apply -f` stays safe without secrets):
# apiVersion: v1
# kind: Secret
# metadata: {name: atlas-secrets, namespace: atlas}
# stringData:
#   ATLAS_LLM_BACKEND: auto
#   GEMINI_API_KEY: ""
#   OPENAI_API_KEY: ""
#   ANTHROPIC_API_KEY: ""
#   S2_API_KEY: ""
#   DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
#   QDRANT_URL: http://qdrant:6333
#   REDIS_URL: redis://redis:6379/0
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: atlas-api, namespace: atlas}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: atlas-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-web
  namespace: atlas
spec:
  replicas: 2
  selector:
    matchLabels: {app: atlas-web}
  template:
    metadata: {labels: {app: atlas-web}}
    spec:
      containers:
        - name: web
          image: atlas-web:dev
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: atlas-web, namespace: atlas}
spec:
  selector: {app: atlas-web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas
  namespace: atlas
  annotations:
    kubernetes.io/ingress-class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend: {service: {name: atlas-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: atlas-web, port: {number: 80}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: atlas-api, namespace: atlas}
spec:
  podSelector: {matchLabels: {app: atlas-api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8000}]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 6333}, {port: 5432}, {port: 6379}]
    - ports: [{port: 443}, {port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: atlas-web, namespace: atlas}
spec:
  podSelector: {matchLabels: {app: atlas-web}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080}]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: atlas-api, namespace: atlas}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: atlas-api}}
---
# Stateful storage (Qdrant / Postgres / Redis): intentionally NOT full
# StatefulSets. The honest scope is one single-replica StatefulSet per
# backing service (volumeClaimTemplates + a Rook-Ceph StorageClass PVC for
# data durability), added when the live path moves off InMemoryStore
# (see AGENTS.md "Runtime reality"). Until then compose owns local
# persistence and this file stays apply-safe without storage classes.
