[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — citation-filtered research intelligence, bounded RAG over earned papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.7.0",
  "python-dotenv==1.0.1",
  "httpx==0.28.1",
  "requests==2.32.3",
  "psycopg[binary]==3.2.5",
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
  "redis==5.2.1",
  "qdrant-client==1.12.1",
  "prometheus-client==0.21.0",
  # LLM + agent
  "langchain==0.3.19",
  "langchain-core==0.3.43",
  "langgraph==0.2.39",
  "langchain-google-genai==2.1.2",
  "google-genai==1.14.0",
  # ingest
  "llama-index==0.12.27",
  "llama-index-readers-file==0.4.6",
  "fastmcp==4.0.0",
  # embeddings / rerank — torch from CPU wheel; sentence-transformers pins HF
  "torch==2.5.1",
  "transformers==4.48.3",
  "sentence-transformers==3.4.1",
  "huggingface-hub==0.28.1",
  "numpy==1.26.4",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.1",
  "fakeredis==2.22.0",
  "responses==0.25.0",
  "ruff==0.9.6",
  "mypy==1.14.1",
]

[project.scripts]
atlas-mcp = "app.mcp.server_atlas:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
